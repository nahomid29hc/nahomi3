<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Snoopy Cafetería</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        /* Paleta de colores de Snoopy */
        :root {
            --snoopy-white: #FFFAEC; /* Crema / Fondo principal */
            --snoopy-red: #E64C3C;   /* Rojo de la caseta de Snoopy */
            --snoopy-blue: #4A90E2;  /* Azul cielo */
            --snoopy-black: #261010; /* Negro profundo */
            --snoopy-yellow: #F7D75E; /* Amarillo soleado */
            --snoopy-light-grey: #D8D8D8; /* Gris claro para bordes */
            --snoopy-dark-grey: #6B6B6B; /* Gris oscuro para texto secundario */
            --snoopy-brown: #7A5B49; /* Para algunos detalles */
        }

        body {
            font-family: 'Comic Sans MS', 'Segoe UI', sans-serif; /* Fuente un poco más juguetona */
            margin: 0; padding: 20px;
            color: var(--snoopy-black);
            background: var(--snoopy-light-grey);
            /* Fondo con huellas de perro */
            background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23ccc' fill-opacity='0.4' fill-rule='evenodd'%3E%3Cpath d='M0 40L40 0H20L0 20M40 40V20L20 40'/%3E%3C/g%3E%3C/svg%3E");
            background-repeat: repeat;
        }

        .container {
            max-width: 1400px; margin: 0 auto;
            display: grid; grid-template-columns: 1.8fr 1fr; gap: 20px;
        }

        section {
            background: var(--snoopy-white);
            padding: 25px; border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            border: 2px solid var(--snoopy-light-grey);
        }

        h2 {
            color: var(--snoopy-brown);
            font-size: 1.8em;
            margin-top: 0; margin-bottom: 20px;
            text-align: center;
            padding: 10px 0;
            background-color: var(--snoopy-yellow);
            border-radius: 12px;
            border-bottom: 3px solid var(--snoopy-red);
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        /* Encabezado Snoopy */
        header {
            text-align: center;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            background-color: var(--snoopy-yellow);
            padding: 15px 30px;
            border-radius: 30px;
            max-width: 400px;
            margin: 20px auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        header img {
            max-width: 70px;
            border-radius: 50%;
            border: 3px solid var(--snoopy-red);
        }
        header h1 {
            color: var(--snoopy-black);
            font-size: 2.2em;
            margin: 0;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }


        /* Selector de Mesa Superior */
        .table-selector {
            background: var(--snoopy-red); color: var(--snoopy-white);
            padding: 15px; border-radius: 15px; margin-bottom: 20px;
            display: flex; align-items: center; justify-content: center; gap: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            font-weight: bold;
            font-size: 1.1em;
            border: 2px solid var(--snoopy-black);
        }
        .table-selector input {
            width: 70px; padding: 8px; font-size: 1.1em; border-radius: 8px; border: none; text-align: center;
            background: var(--snoopy-white);
            color: var(--snoopy-black);
        }
        .table-selector span {
            font-size: 0.9em;
            opacity: 0.9;
        }

        /* Grid de Menú */
        .menu-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px;
        }

        .item-card {
            background: var(--snoopy-white);
            border-radius: 15px; padding: 15px;
            display: flex; flex-direction: column; align-items: center;
            text-align: center;
            transition: transform 0.2s ease-in-out;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border: 3px solid var(--snoopy-light-grey); /* Borde por defecto */
        }
        .item-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 15px rgba(0,0,0,0.2);
        }

        /* Bordes de color para las tarjetas */
        .item-card.coffee { border-color: var(--snoopy-red); }
        .item-card.drink { border-color: var(--snoopy-blue); }
        .item-card.frappe { border-color: var(--snoopy-brown); } /* Nuevo color para frappes */
        .item-card.dessert { border-color: var(--snoopy-yellow); }

        .item-card svg {
            width: 60px; height: 60px;
            margin-bottom: 10px;
        }
        /* Colores de los iconos */
        .item-card.coffee svg { fill: var(--snoopy-red); }
        .item-card.drink svg { fill: var(--snoopy-blue); }
        .item-card.frappe svg { fill: var(--snoopy-brown); }
        .item-card.dessert svg { fill: var(--snoopy-yellow); }

        .item-name {
            font-weight: bold; font-size: 1.2em;
            margin-bottom: 8px;
            color: var(--snoopy-black);
        }
        .item-description {
            font-size: 0.9em;
            color: var(--snoopy-dark-grey);
            margin-bottom: 15px;
        }

        /* Botones de Tamaño */
        .size-group {
            display: flex; gap: 8px; margin-bottom: 15px;
            background-color: var(--snoopy-light-grey);
            border-radius: 8px;
            padding: 5px;
        }
        .btn-size {
            flex: 1; padding: 8px 5px; border: none;
            background: var(--snoopy-white); color: var(--snoopy-black);
            border-radius: 6px; cursor: pointer; font-size: 0.9em;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        .btn-size.active {
            background: var(--snoopy-blue); /* Activo en azul */
            color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        /* Botones de cantidad */
        .qty-controls {
            display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 15px;
        }
        .btn-qty {
            width: 40px; height: 40px; border-radius: 50%; border: none;
            background: var(--snoopy-red); color: white; font-size: 1.6em; cursor: pointer;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: background-color 0.2s;
        }
        .btn-qty:hover {
            background: var(--snoopy-black);
        }
        .qty-value {
            font-size: 1.5em;
            font-weight: bold;
            color: var(--snoopy-black);
        }

        .price-display {
            font-size: 1.6em; font-weight: bold; color: var(--snoopy-red);
            text-align: center; margin-bottom: 15px;
            background-color: var(--snoopy-yellow);
            padding: 5px 10px;
            border-radius: 8px;
        }

        .btn-add {
            background: var(--snoopy-blue); color: white; border: none;
            padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold;
            font-size: 1.1em;
            box-shadow: 0 3px 8px rgba(0,0,0,0.2);
            transition: background-color 0.2s, transform 0.1s;
        }
        .btn-add:active { transform: scale(0.98); background: var(--snoopy-black); }

        /* Tabla de pedidos */
        .orders-section {
            background: var(--snoopy-white);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            border: 2px solid var(--snoopy-red); /* Borde rojo para la sección de pedidos */
        }

        .orders-section h2 {
            background-color: var(--snoopy-red);
            color: var(--snoopy-white);
            border-bottom: none;
        }


        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background: var(--snoopy-blue); color: white; padding: 12px; font-size: 0.9em; text-align: left;}
        td { padding: 12px; border-bottom: 1px solid var(--snoopy-light-grey); text-align: left; vertical-align: middle; }

        .status { padding: 6px 10px; border-radius: 15px; font-size: 0.8em; font-weight: bold; text-align: center; display: inline-block;}
        .pedido { background: #fee2e2; color: #ef4444; } /* Rojo claro */
        .en_espera { background: #e0f2fe; color: #2563eb; } /* Azul claro */
        .entregado { background: #dcfce7; color: #22c55e; } /* Verde claro */

        .btn-status-action {
            width: 40px; height: 40px; border-radius: 50%;
            border: none; background: var(--snoopy-yellow); color: var(--snoopy-black);
            font-size: 1.4em; cursor: pointer; font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            transition: background-color 0.2s;
        }
        .btn-status-action:hover {
            background: var(--snoopy-red);
            color: white;
        }


        .btn-excel {
            background: var(--snoopy-black); color: var(--snoopy-white);
            width: 100%; padding: 15px; border: none; border-radius: 10px;
            font-weight: bold; margin-top: 20px; cursor: pointer;
            font-size: 1.1em;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            transition: background-color 0.2s, transform 0.1s;
        }
        .btn-excel:hover {
            background: var(--snoopy-brown);
        }
        .btn-excel:active { transform: scale(0.98); }

        /* Responsive adjustments */
        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<header>
    <img src="https://i.ibb.co/L5k6pQZ/snoopy-head.png" alt="Logo Snoopy"> <h1>POS Snoopy</h1>
</header>

<div class="table-selector">
    <label>MESA ACTUAL:</label>
    <input type="number" id="global-table" value="1" min="1">
    <span>(Selecciona la mesa antes de agregar un producto)</span>
</div>

<div class="container">
    <section>
        <h2>Menú</h2>
        <div class="menu-grid" id="menu-container"></div>
    </section>

    <section class="orders-section">
        <h2>Comanda</h2>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Mesa</th>
                        <th>Cant.</th>
                        <th>Producto</th>
                        <th>Total</th>
                        <th>Estado</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="orders-body"></tbody>
            </table>
        </div>
        <button class="btn-excel" onclick="exportToExcel()">Exportar Reporte Excel</button>
    </section>
</div>
